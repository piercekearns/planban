name: Agent-investigated bug
description: Report a Planban problem that your coding agent investigated on your machine.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when an agent investigated the affected Planban installation. Unknown facts are acceptable. Review and redact the draft before publishing it.
  - type: textarea
    id: impact
    attributes:
      label: What happened and why it matters
      description: Preserve the user's experience in plain language.
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: Agent investigation
      description: Separate observed evidence, user-reported facts, inferences, and unknowns.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Best-known reproduction
      description: Give the shortest reliable steps, or explain why a deterministic reproduction was not recovered.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Planban/plugin version, OS/build/architecture, host, and install shape. Use "unknown" where necessary.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include only the most relevant errors, logs, screenshots, or before/after results. Remove secrets, private paths, board contents, and project details.
      render: shell
  - type: textarea
    id: local-fix
    attributes:
      label: Workaround or local fix
      description: Describe anything attempted, whether code was implemented, and whether the original failure was retested successfully.
  - type: textarea
    id: related
    attributes:
      label: Related issues, pull requests, and releases
      description: Record matches the agent checked and why this is a duplicate, distinct report, or regression.
  - type: textarea
    id: unknowns
    attributes:
      label: Unknown or unavailable facts
      description: Missing information does not block the report; say what could not be recovered.
  - type: input
    id: agent
    attributes:
      label: Investigated by
      description: Agent, model, and harness that investigated or implemented the work.
      placeholder: Codex with GPT-5 through Codex Desktop
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the agent-prepared report and removed private board contents, paths, credentials, logs, screenshots, and project details that should not be public.
          required: true
