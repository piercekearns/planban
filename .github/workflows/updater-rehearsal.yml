name: Updater rehearsal

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/updater-rehearsal.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/assert-update-performance.mjs"
      - "scripts/platform-invocation.mjs"
      - "scripts/platform-invocation.d.mts"
      - "scripts/rehearse-marketplace-update-performance.mjs"
      - "scripts/update-marketplace-runtime.mjs"
      - "src/core/updateRunner.ts"
      - "tests/update-marketplace-runtime.test.ts"
      - "tests/update-performance-assertion.test.ts"
      - "tests/platform-invocation.test.ts"
  workflow_dispatch:
    inputs:
      from_version:
        description: Public Planban version used as the old marketplace
        required: true
        default: "1.1.3"
        type: string
      target_ref:
        description: Remote branch or tag containing the exact candidate
        required: true
        type: string
      expected_commit:
        description: Exact commit the marketplace must install
        required: true
        type: string

jobs:
  marketplace-update:
    name: Marketplace update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      FROM_VERSION: ${{ inputs.from_version || '1.1.3' }}
      TARGET_REF: ${{ inputs.target_ref || github.event.pull_request.head.ref }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.150.1

      - name: Run focused cross-platform fallback tests
        run: node --test --import tsx/esm tests/platform-invocation.test.ts tests/update-marketplace-runtime.test.ts tests/update-performance-assertion.test.ts

      - name: Run five clean and five reuse marketplace updates
        run: >-
          node scripts/rehearse-marketplace-update-performance.mjs
          --from-version "$FROM_VERSION"
          --target-ref "$TARGET_REF"
          --expected-commit "$EXPECTED_COMMIT"
          --iterations 5
          --mode both
          > update-performance.json
        shell: bash

      - name: Enforce correctness and relative speed gate
        run: >-
          node scripts/assert-update-performance.mjs
          --file update-performance.json
          --expected-commit "$EXPECTED_COMMIT"
          --iterations 5
          --minimum-improvement 0.2
        shell: bash

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-rehearsal-${{ matrix.os }}
          path: update-performance.json
          if-no-files-found: warn

  runtime-compatibility:
    name: Runtime compatibility (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
        node:
          - 22.12.0
          - 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run updater compatibility tests
        run: node --test --import tsx/esm tests/platform-invocation.test.ts tests/update-marketplace-runtime.test.ts tests/update-performance-assertion.test.ts tests/update-runner.test.ts
